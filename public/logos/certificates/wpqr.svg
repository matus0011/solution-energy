<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64" role="img" aria-label="WPQR - Welding Procedure Qualification Record / EN ISO 15614-1">
  <defs>
    <linearGradient id="wpqrGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Left: Industrial Welding Qualification Seal (Center: cx=32, cy=32) -->
  <g id="wpqr-emblem">
    <!-- Outer Precision Rings -->
    <circle cx="32" cy="32" r="29" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="32" cy="32" r="24.5" fill="none" stroke="#94a3b8" stroke-width="0.75"/>
    <circle cx="32" cy="32" r="22.5" fill="url(#wpqrGrad)" stroke="none"/>

    <!-- Cardinal Inspection Rivets / Notches -->
    <circle cx="32" cy="5.5" r="1.1" fill="#475569"/>
    <circle cx="32" cy="58.5" r="1.1" fill="#475569"/>
    <circle cx="5.5" cy="32" r="1.1" fill="#475569"/>
    <circle cx="58.5" cy="32" r="1.1" fill="#475569"/>

    <!-- Welding Heraldic Shield (Tarcza Spawalnicza) -->
    <path d="M20.5,18.5 L43.5,18.5 C43.5,18.5 43.5,29.5 43.5,31 C43.5,40.5 32,45.5 32,45.5 C32,45.5 20.5,40.5 20.5,31 C20.5,29.5 20.5,18.5 20.5,18.5 Z" 
          fill="url(#wpqrGrad)" stroke="#334155" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Welding Torch Nozzle (Angled at 45 deg from upper-left) -->
    <path d="M23.5,22 L25.5,20.5 L29,25 L27.5,26 Z" fill="#475569" stroke="#334155" stroke-width="0.6"/>
    <!-- Tungsten Electrode -->
    <line x1="28.2" y1="25.5" x2="30.2" y2="27.8" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Electric Arc Flash / Radiant Starburst (Łuk spawalniczy) at (31, 29) -->
    <circle cx="31" cy="29" r="2.6" fill="#38bdf8" opacity="0.35"/>
    <path d="M31,25.5 Q31,29 34.5,29 Q31,29 31,32.5 Q31,29 27.5,29 Q31,29 31,25.5 Z" fill="#0284c7"/>
    <circle cx="31" cy="29" r="1.3" fill="#ffffff"/>

    <!-- Flying Welding Sparks (Iskry łuku spawalniczego) -->
    <circle cx="35" cy="26.5" r="0.8" fill="#f59e0b"/>
    <circle cx="36.5" cy="30.5" r="0.65" fill="#f59e0b"/>
    <circle cx="26.5" cy="32" r="0.65" fill="#f59e0b"/>
    <circle cx="33.8" cy="23.8" r="0.5" fill="#f59e0b"/>

    <!-- Joined Plates & Weld Seam (Ukosowanie & Ścieg spoiny) -->
    <path d="M23.5,37.5 L28,37.5 L29.3,39.5 L23.5,39.5 Z" fill="#94a3b8"/>
    <path d="M32.7,39.5 L34,37.5 L38.5,37.5 L38.5,39.5 Z" fill="#94a3b8"/>
    <path d="M28,37.5 Q31,35.8 34,37.5 L32.7,39.5 Q31,40 29.3,39.5 Z" fill="#334155"/>
    <path d="M28.8,37.3 Q31,36.4 33.2,37.3" fill="none" stroke="#e2e8f0" stroke-width="0.65"/>

    <!-- Micro-Engraved Seals inside ring -->
    <text x="32" y="14" text-anchor="middle" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="4.8" fill="#475569" letter-spacing="1">WPQR</text>
    <text x="32" y="53.8" text-anchor="middle" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="4" fill="#64748b" letter-spacing="0.5">ISO 15614</text>
  </g>

  <!-- Right: Typography & Specification -->
  <g id="wpqr-text">
    <text x="74" y="31" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#26282C" letter-spacing="-0.3">WPQR</text>
    
    <rect x="142" y="16.5" width="50" height="15" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="167" y="27.5" text-anchor="middle" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7.5" fill="#475569" letter-spacing="0.5">QUALIFIED</text>

    <text x="74" y="49" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" letter-spacing="0.4" fill="#64748b">EN ISO 15614-1</text>
  </g>
</svg>
