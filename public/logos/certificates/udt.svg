<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64" role="img" aria-label="UDT - Urząd Dozoru Technicznego / F-GAZY">
  <title>Urząd Dozoru Technicznego - Certyfikat UDT F-GAZY</title>
  <defs>
    <!-- UDT Red Brand Gradient (#E30613) -->
    <linearGradient id="udtRedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#C4000C"/>
    </linearGradient>
    <filter id="udtShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left: Official UDT Industrial & Pressure Equipment Seal (Center: cx=32, cy=32) -->
  <g id="udt-emblem" filter="url(#udtShadow)">
    <!-- 12-Tooth Industrial Gear Wheel (Koło Zębate) in UDT Red #E30613 -->
    <path d="M 58.40,29.69 L 58.40,34.31 L 54.52,35.57 L 53.29,40.17 L 56.02,43.20 L 53.71,47.20 L 49.72,46.35 L 46.47,49.60 L 47.32,53.59 L 43.32,55.90 L 40.29,53.17 L 35.69,54.40 L 34.43,58.28 L 29.81,58.28 L 28.55,54.40 L 23.95,53.17 L 20.92,55.90 L 16.92,53.59 L 17.77,49.60 L 14.52,46.35 L 10.53,47.20 L 8.22,43.20 L 10.95,40.17 L 9.72,35.57 L 5.84,34.31 L 5.84,29.69 L 9.72,28.43 L 10.95,23.83 L 8.22,20.80 L 10.53,16.80 L 14.52,17.65 L 17.77,14.40 L 16.92,10.41 L 20.92,8.10 L 23.95,10.83 L 28.55,9.60 L 29.81,5.72 L 34.43,5.72 L 35.69,9.60 L 40.29,10.83 L 43.32,8.10 L 47.32,10.41 L 46.47,14.40 L 49.72,17.65 L 53.71,16.80 L 56.02,20.80 L 53.29,23.83 L 54.52,28.43 Z"
          fill="url(#udtRedGrad)"/>
    
    <!-- Outer Gear Rim Inner Guide Line -->
    <circle cx="32" cy="32" r="21.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
    
    <!-- Central White Field -->
    <circle cx="32" cy="32" r="19" fill="#FFFFFF"/>
    
    <!-- Pressure Vessel / Retort / Cylinder ("Flasza / Zbiornik Ciśnieniowy F-Gazów") -->
    <!-- Valve Handwheel & Stem at top -->
    <line x1="29.2" y1="16" x2="34.8" y2="16" stroke="#1E2022" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="32" y1="16" x2="32" y2="18.5" stroke="#1E2022" stroke-width="1.3"/>
    <rect x="30" y="18" width="4" height="2" fill="#E30613" rx="0.5"/>
    
    <!-- Vessel Body Contour & Fill -->
    <path d="M 30.5,19.5 L 33.5,19.5 C 33.5,22 39.5,23.5 39.5,26.5 L 39.5,36.5 C 39.5,40.5 24.5,40.5 24.5,36.5 L 24.5,26.5 C 24.5,23.5 30.5,22 30.5,19.5 Z"
          fill="#FEF2F2" stroke="#E30613" stroke-width="1.2" stroke-linejoin="round"/>
    
    <!-- Manometer / Pressure Gauge (Ciśnieniomierz) -->
    <circle cx="32" cy="28.5" r="3.4" fill="#FFFFFF" stroke="#1E2022" stroke-width="0.8"/>
    <line x1="32" y1="28.5" x2="33.8" y2="26.7" stroke="#E30613" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="32" cy="28.5" r="0.6" fill="#1E2022"/>
    <!-- Gauge Tick Marks -->
    <line x1="30" y1="28.5" x2="30.7" y2="28.5" stroke="#64748B" stroke-width="0.5"/>
    <line x1="34" y1="28.5" x2="33.3" y2="28.5" stroke="#64748B" stroke-width="0.5"/>
    <line x1="32" y1="26.5" x2="32" y2="27.2" stroke="#64748B" stroke-width="0.5"/>

    <!-- Cylinder Base Stand -->
    <rect x="26.5" y="37" width="11" height="1.8" rx="0.6" fill="#1E2022"/>

    <!-- Plaque Banner with UDT Monogram -->
    <rect x="17.5" y="40.5" width="29" height="10" rx="2" fill="#E30613" stroke="#FFFFFF" stroke-width="0.9"/>
    <text x="32" y="48" text-anchor="middle" font-family="Montserrat, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" letter-spacing="1.2">UDT</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="64" y1="12" x2="64" y2="52" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right: Official Typography -->
  <g id="udt-typography">
    <!-- Kicker: Full Official Name -->
    <text x="74" y="18" font-family="Montserrat, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7" letter-spacing="0.9" fill="#E30613">URZĄD DOZORU TECHNICZNEGO</text>

    <!-- Main Line: UDT + Pill Badge -->
    <text x="74" y="36.5" font-family="Montserrat, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18.5" letter-spacing="-0.3" fill="#1E2022">UDT</text>

    <!-- Pill Badge: CERTYFIKAT / F-GAZY -->
    <rect x="122" y="23" width="66" height="16" rx="3.5" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="155" y="34.2" text-anchor="middle" font-family="Montserrat, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7.5" fill="#E30613" letter-spacing="0.5">CERTYFIKAT</text>

    <!-- Subtitle: Specific Qualification Scope -->
    <text x="74" y="51" font-family="Montserrat, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.3" letter-spacing="0.1" fill="#64748B">Uprawnienia F-Gazy · Urządzenia Ciśnieniowe</text>
  </g>
</svg>
