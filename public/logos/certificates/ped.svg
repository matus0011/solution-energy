<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64" role="img" aria-label="PED 2014/68/UE - CE Dyrektywa Ciśnieniowa">
  <defs>
    <linearGradient id="pedGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Left: Industrial CE / PED Pressure Equipment Seal (Center: cx=32, cy=32) -->
  <g id="ped-emblem">
    <!-- Outer Precision Rings -->
    <circle cx="32" cy="32" r="29" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="32" cy="32" r="24.5" fill="none" stroke="#94a3b8" stroke-width="0.75"/>
    <circle cx="32" cy="32" r="22.5" fill="url(#pedGrad)" stroke="none"/>

    <!-- Pressure Gauge Calibration Scale (Top Arc) -->
    <line x1="12.9" y1="15.9" x2="14.8" y2="17.5" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
    <line x1="17.7" y1="11.5" x2="19.1" y2="13.6" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
    <line x1="23.5" y1="8.5" x2="24.3" y2="10.8" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
    <line x1="40.5" y1="8.5" x2="39.7" y2="10.8" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
    <line x1="46.3" y1="11.5" x2="44.9" y2="13.6" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
    <line x1="51.1" y1="15.9" x2="49.2" y2="17.5" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>

    <!-- Manometer Setpoint Index -->
    <polygon points="32,13 29.5,9 34.5,9" fill="#0284c7"/>

    <!-- Official CE Mark (Scaled to 30.8 x 22 centered at 32, 29.5) -->
    <g transform="translate(32, 29.5) scale(0.11) translate(-140, -100)" fill="#1e293b">
      <!-- C -->
      <path d="M110,199.498744A100,100 0 0 1 100,200A100,100 0 0 1 100,0A100,100 0 0 1 110,0.501256L110,30.501256A70,70 0 0 0 100,30A70,70 0 0 0 100,170A70,70 0 0 0 110,169.498744Z"/>
      <!-- E -->
      <path d="M280,199.498744A100,100 0 0 1 270,200A100,100 0 0 1 270,0A100,100 0 0 1 280,0.501256L280,30.501256A70,70 0 0 0 270,30A70,70 0 0 0 201.620283,85L260,85L260,115L201.620283,115A70,70 0 0 0 270,170A70,70 0 0 0 280,169.498744Z"/>
    </g>

    <!-- Bottom PED Identification Badge Pill inside seal -->
    <rect x="20.5" y="44" width="23" height="7.5" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.75"/>
    <text x="32" y="49.8" text-anchor="middle" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="5.2" fill="#0284c7" letter-spacing="0.8">PED</text>
  </g>

  <!-- Right: Typography & Specification -->
  <g id="ped-text">
    <text x="74" y="31" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#26282C" letter-spacing="-0.3">PED</text>
    
    <rect x="127" y="16.5" width="63" height="15" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="158.5" y="27.5" text-anchor="middle" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8" fill="#475569" letter-spacing="0.5">MODUŁ A2</text>

    <text x="74" y="49" font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" letter-spacing="0.5" fill="#64748b">2014/68/UE</text>
  </g>
</svg>
